name: BELTRIX Mobile Focus Release Gate
on:
  push:
    branches: [fix/mobile-focus-layout-only-2026-09-30]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beltrix-mobile-focus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify-${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            config: web/playwright.config.cjs
          - browser: webkit
            config: web/playwright.ios.config.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Unit and focus policy regressions
        run: |
          npm run test:unit
          node --test web/tests/trade-focus.test.mjs
      - name: Build checked sources
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Full browser regressions including wallet lifecycle
        run: npx playwright test --config=${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beltrix-focus-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            test-results/
            test-results-ios/
          retention-days: 7
