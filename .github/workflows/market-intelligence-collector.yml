name: BELTRIX Market Intelligence Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: beltrix-market-intelligence-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Validate collector modules
        run: npm run test:intelligence
      - name: Collect BTC ETH SOL market intelligence
        env:
          MI_ASSETS: BTC,ETH,SOL
          MI_OUTPUT: test-results/market-intelligence/latest.json
        run: node internal/dex-intelligence/scheduled-collector.mjs
      - name: Upload normalized telemetry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-${{ github.run_id }}
          path: test-results/market-intelligence/
          retention-days: 14
