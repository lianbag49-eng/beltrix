name: BELTRIX Market Intelligence Collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'internal/dex-intelligence/**'
      - '.github/workflows/market-intelligence-collector.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: beltrix-market-intelligence-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Validate collector modules
        run: npm run test:intelligence
      - name: Collect BTC ETH SOL market intelligence
        env:
          MI_ASSETS: BTC,ETH,SOL
          MI_OUTPUT: test-results/market-intelligence/latest.json
        run: node internal/dex-intelligence/scheduled-collector.mjs
      - name: Prepare Postgres persistence SQL
        run: node internal/dex-intelligence/postgres-export.mjs test-results/market-intelligence/latest.json test-results/market-intelligence/persist.sql
      - name: Persist to Neon/Postgres when configured
        env:
          MI_DATABASE_URL: ${{ secrets.MI_DATABASE_URL }}
        run: |
          if [ -z "$MI_DATABASE_URL" ]; then
            echo "MI_DATABASE_URL is not configured; retaining artifact-only history for this run."
            exit 0
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y postgresql-client
          fi
          psql "$MI_DATABASE_URL" -v ON_ERROR_STOP=1 -f internal/dex-intelligence/storage/postgres-schema.sql
          psql "$MI_DATABASE_URL" -v ON_ERROR_STOP=1 -f test-results/market-intelligence/persist.sql
      - name: Upload normalized telemetry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-${{ github.run_id }}
          path: test-results/market-intelligence/
          retention-days: 14
