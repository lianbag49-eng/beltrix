name: Apply reviewed USDT source to feature branch
on:
  push:
    branches: [update/usdt-multichain]
    paths: ['.github/workflows/usdt-apply.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: apply-usdt-source
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/update/usdt-multichain'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: lianbag49-eng/beltrix
          run-id: 35089165526
          name: usdt-dependencies
          path: ${{ runner.temp }}/usdt-dependencies
      - name: Verify all source bytes before applying to feature branch
        run: python3 usdt-stage/apply.py "$RUNNER_TEMP/usdt-dependencies"
      - name: Validate exact package and code
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run test:unit
          npm run build
          git diff --check
      - name: Commit source files only within runner permissions
        run: |
          test "$GITHUB_REF" = "refs/heads/update/usdt-multichain"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # GITHUB_TOKEN cannot modify workflow files. They remain unchanged here.
          # The connected authorized GitHub action applies reviewed workflow edits separately.
          git restore --source=HEAD --worktree -- .github/workflows
          git add -A
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          manifest=json.loads(Path(os.environ['RUNNER_TEMP'],'usdt-source-manifest.json').read_text())
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert not any(p.startswith('.github/workflows/') for p in changed)
          assert all(p in manifest or p.startswith('usdt-stage/') for p in changed)
          for p,digest in manifest.items():
              if not p.startswith('.github/workflows/'):
                  assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==digest,p
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement reviewed eight-network USDT wallet and guarded transfer adapters'
          git push origin HEAD:refs/heads/update/usdt-multichain
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usdt-source-manifest
          path: ${{ runner.temp }}/usdt-source-manifest.json
          retention-days: 7
