name: Prepare USDT integration dependencies
on:
  push:
    branches: [update/usdt-multichain]
    paths: ['.github/workflows/usdt-bootstrap.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed SDK versions
        run: |
          npm install --save-exact tronweb@6.5.1 @solana/web3.js@1.98.4 @solana/spl-token@0.4.14 buffer@6.0.3 bs58@6.0.0
          npm ls --depth=0 > sdk-versions.txt
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Package lock and isolated local test dependencies
        if: always()
        run: tar -czf usdt-dependencies.tar.gz package.json package-lock.json node_modules sdk-versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usdt-dependencies
          path: usdt-dependencies.tar.gz
          retention-days: 7
