name: BELTRIX iPhone Trading Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/iphone-trading-regression.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/iphone-trading-regression.yml'

permissions:
  contents: read

concurrency:
  group: beltrix-iphone-trading-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run iPhone trading regressions
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results-ios/results.json
        run: >
          npx playwright test
          web/tests/futures-ux.spec.cjs
          web/tests/trading.spec.cjs
          web/tests/trade-simple.spec.cjs
          web/tests/focus-scroll/
          --config=web/playwright.ios.config.cjs
          --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-trading-regression
          path: |
            test-results-ios/
            test-results/
          retention-days: 7
