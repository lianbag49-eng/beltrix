name: Android Preview APK
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-preview.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beltrix-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build existing web snapshot and verify native packaging
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run test:unit
          npm run build
          node web/prepare-site.mjs --root
          node android/scripts/check-source.mjs
          node android/scripts/package-web.mjs
          node --check android/web/android-adapter.js
          npx playwright install --with-deps chromium
          npx playwright test --config=android/playwright.config.cjs
      - name: Android unit tests, lint and test-signed APK
        run: gradle -p android testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 emulator tests (no real wallet or funds)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android/scripts/device-test.sh
      - name: Verify and prepare APK download
        run: |
          mkdir -p android-download
          cp android/app/build/outputs/apk/debug/app-debug.apk android-download/BELTRIX-Android-0.1.0-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-download/BELTRIX-Android-0.1.0-preview.apk | tee android-evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-download/BELTRIX-Android-0.1.0-preview.apk > android-evidence/apk-badging.txt
          cp android/README.md android-download/RELEASE-NOTES.md
          cp android-evidence/packaged-assets.json android-download/APK-SOURCE.json
          cd android-download && sha256sum BELTRIX-Android-0.1.0-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: beltrix-android-apk
          path: android-download/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beltrix-android-validation
          path: |
            android-evidence/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/test-results/
          retention-days: 14
      - name: Preserve exact source (no build outputs or signing keys)
        if: always()
        run: git archive --format=tar.gz -o android-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beltrix-android-source
          path: android-source.tar.gz
          retention-days: 7
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beltrix-android-apk
          path: download
      - name: Publish first Android preview without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view android-v0.1.0-preview >/dev/null 2>&1; then
            echo 'This preview version is already published; never replace its signed APK.'
            exit 0
          fi
          gh release create android-v0.1.0-preview download/* --target "$GITHUB_SHA" --prerelease --title 'BELTRIX Android 0.1.0 Preview' --notes-file download/RELEASE-NOTES.md
