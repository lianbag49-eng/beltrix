name: Validate BELTRIX Protocol
on:
  pull_request:
    paths:
      - 'protocol/**'
      - 'docs/BELTRIX-PROTOCOL-ARCHITECTURE-KO.md'
      - 'package.json'
      - '.github/workflows/protocol-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:protocol
      - run: npm run test:unit
      - run: npm run build
